
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #17132e,
                #39305f,
                #7655a8
            );
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            background: rgba(25, 20, 55, 0.85);
            border: 1px solid rgba(210, 190, 255, 0.3);
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
        }

        .container h1 {
            text-align: center;
            color: #e5d5ff;
            font-size: 29px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #bdb1d9;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            color: #f1eaff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            background: #19152f;
            border: 1px solid #62547f;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #c5a5ff;
            box-shadow: 0 0 10px rgba(197, 165, 255, 0.3);
        }

        input::placeholder {
            color: #968baa;
        }

        .gender-options {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .gender-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 400;
            cursor: pointer;
        }

        .gender-options input {
            width: auto;
            accent-color: #c5a5ff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(
                90deg,
                #a78bfa,
                #d8b4fe
            );
            color: #24183d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(190, 150, 255, 0.4);
        }

        .footer {
            text-align: center;
            color: #aaa0c5;
            font-size: 12px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <p class="subtitle">
            Create your account by filling in the details below
        </p>

        <form action="#" method="post">

            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       name="name"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       name="phone"
                       placeholder="Enter 10-digit phone number"
                       pattern="[0-9]{10}"
                       required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       name="password"
                       placeholder="Create your password"
                       minlength="6"
                       required>
            </div>

            <div class="input-group">
                <label>Gender</label>

                <div class="gender-options">

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Male"
                               required>
                        Male
                    </label>

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Other">
                        Other
                    </label>

                </div>
            </div>

            <button type="submit" class="submit-btn">
                Register Now
            </button>

        </form>

        <p class="footer">
            Student Registration Portal | HTML & CSS
        </p>

    </div>

</body>
</html>
