
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;

            background: linear-gradient(
                135deg,
                #17132e,
                #39305f,
                #7655a8
            );
        }

        .container {
            width: 100%;
            max-width: 470px;
            padding: 35px;

            background: rgba(25, 20, 55, 0.92);
            border: 1px solid rgba(210, 190, 255, 0.3);
            border-radius: 22px;

            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
        }

        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        h1 {
            color: #e5d5ff;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #bdb1d9;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            color: #f1eaff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;

            background: #19152f;
            border: 1px solid #62547f;
            border-radius: 10px;

            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #c5a5ff;
            box-shadow: 0 0 10px rgba(197, 165, 255, 0.3);
        }

        input::placeholder {
            color: #968baa;
        }

        select option {
            background: #19152f;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #a78bfa,
                #d8b4fe
            );

            color: #24183d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(190, 150, 255, 0.4);
        }

        #message {
            font-size: 14px;
            text-align: center;
            font-weight: 600;
            margin: 12px 0;
            min-height: 20px;
        }

        footer {
            text-align: center;
            color: #aaa0c5;
            font-size: 12px;
            margin-top: 23px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="form-header">

            <div class="icon">🎓</div>

            <h1>Student Registration</h1>

            <p>Join us and start your learning journey!</p>

        </div>

        <form id="registrationForm">

            <div class="input-group">

                <label for="name">Full Name</label>

                <input type="text"
                       id="name"
                       placeholder="Enter your full name">

            </div>

            <div class="input-group">

                <label for="email">Email Address</label>

                <input type="text"
                       id="email"
                       placeholder="Enter your email">

            </div>

            <div class="input-group">

                <label for="age">Age</label>

                <input type="number"
                       id="age"
                       placeholder="Enter your age">

            </div>

            <div class="input-group">

                <label for="course">Select Course</label>

                <select id="course">

                    <option value="">Choose your course</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Java Programming">Java Programming</option>
                    <option value="Python Programming">Python Programming</option>

                </select>

            </div>

            <div class="input-group">

                <label for="password">Password</label>

                <input type="password"
                       id="password"
                       placeholder="Create your password">

            </div>

            <p id="message" role="alert"></p>

            <button type="submit">
                Register Now
            </button>

        </form>

        <footer>
            Student Registration Portal | Day 5 Practical
        </footer>

    </div>


    <script>

        const form = document.getElementById("registrationForm");

        const message = document.getElementById("message");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value.trim();

            const email = document.getElementById("email").value.trim();

            const age = document.getElementById("age").value;

            const course = document.getElementById("course").value;

            const password = document.getElementById("password").value;


            // Check empty fields

            if (
                name === "" ||
                email === "" ||
                age === "" ||
                course === "" ||
                password === ""
            ) {

                showError("Please fill in all the fields!");

                return;

            }


            // Check email format

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {

                showError("Please enter a valid email address!");

                return;

            }


            // Check age

            if (Number(age) <= 0) {

                showError("Please enter a valid age!");

                return;

            }


            // Check password length

            if (password.length < 6) {

                showError("Password must contain at least 6 characters!");

                return;

            }


            // Display success message

            message.style.color = "#86efac";

            message.textContent = "Registration Successful! 🎉";


            // Clear form automatically

            form.reset();

        });


        // Function to display error messages

        function showError(text) {

            message.style.color = "#ff8b9b";

            message.textContent = text;

        }

    </script>

</body>

</html>
