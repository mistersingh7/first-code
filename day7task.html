
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List | Day 7 Practical</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #f7f4ff;
      background:
        radial-gradient(circle at top left, #493b78, transparent 38%),
        linear-gradient(135deg, #111326, #282044 60%, #392c60);
    }

    .app {
      width: 100%;
      max-width: 620px;
      padding: 34px;
      border: 1px solid rgba(190, 166, 255, 0.28);
      border-radius: 24px;
      background: rgba(24, 22, 48, 0.94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #c1aaff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .subtitle {
      margin: 10px 0 26px;
      color: #bdb8d2;
      line-height: 1.6;
      font-size: 14px;
    }

    .entry-row {
      display: flex;
      gap: 10px;
    }

    #taskInput {
      flex: 1;
      min-width: 0;
      padding: 15px 16px;
      border: 1px solid #554a78;
      border-radius: 12px;
      outline: none;
      color: #fff;
      background: #131329;
      font-size: 15px;
    }

    #taskInput::placeholder {
      color: #8f89a8;
    }

    #taskInput:focus {
      border-color: #b79aff;
      box-shadow: 0 0 0 3px rgba(183, 154, 255, 0.14);
    }

    button {
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    #addButton {
      padding: 0 20px;
      color: #21183c;
      background: linear-gradient(135deg, #b79aff, #d0b7ff);
      font-size: 14px;
    }

    #message {
      min-height: 20px;
      margin: 10px 2px 0;
      color: #ffabbc;
      font-size: 13px;
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 2px 12px;
      color: #d8cff5;
      font-size: 13px;
      font-weight: 600;
    }

    #taskCount {
      padding: 6px 10px;
      border: 1px solid #5c4e82;
      border-radius: 20px;
      color: #d3c1ff;
      background: #2b2448;
    }

    #taskList {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid #443b63;
      border-radius: 13px;
      background: #24203e;
    }

    .task-check {
      width: 19px;
      height: 19px;
      accent-color: #b79aff;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      color: #f3efff;
      font-size: 14px;
    }

    .task-item.completed {
      border-color: #365c55;
      background: #1e3435;
    }

    .task-item.completed .task-text {
      color: #a5bdb6;
      text-decoration: line-through;
    }

    .delete-button {
      padding: 8px 11px;
      color: #ffdce5;
      background: #563047;
      font-size: 12px;
    }

    .delete-button:hover {
      background: #75405d;
    }

    .empty-state {
      padding: 25px 12px;
      border: 1px dashed #51476e;
      border-radius: 13px;
      color: #a9a2c1;
      text-align: center;
      font-size: 13px;
    }

    .tip {
      margin: 22px 0 0;
      color: #8f89aa;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .app {
        padding: 24px 18px;
      }

      .entry-row {
        flex-direction: column;
      }

      #addButton {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <p class="eyebrow">Day 7 • HTML · CSS · JavaScript</p>

    <h1>My To-Do List</h1>

    <p class="subtitle">
      Plan your day, keep track of your tasks,
      and celebrate every small win.
    </p>

    <div class="entry-row">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a task..."
        aria-label="Enter a task"
      >

      <button id="addButton" type="button">
        ＋ Add Task
      </button>
    </div>

    <p id="message" role="status"></p>

    <div class="list-heading">
      <span>Your tasks</span>
      <span id="taskCount">0 tasks</span>
    </div>

    <ul id="taskList">
      <li class="empty-state" id="emptyState">
        No tasks yet. Add your first task above!
      </li>
    </ul>

    <p class="tip">Tip: Press Enter to add a task.</p>

  </main>

  <script>
    const taskInput = document.getElementById("taskInput");
    const addButton = document.getElementById("addButton");
    const taskList = document.getElementById("taskList");
    const message = document.getElementById("message");
    const taskCount = document.getElementById("taskCount");

    // Update total task count
    function updateTaskCount() {
      const tasks = taskList.querySelectorAll(".task-item");
      const total = tasks.length;

      taskCount.innerText =
        total + (total === 1 ? " task" : " tasks");
    }

    // Add a new task
    function addTask() {
      const taskName = taskInput.value.trim();

      // Check empty input
      if (taskName === "") {
        message.innerText = "Please enter a task first!";
        taskInput.focus();
        return;
      }

      message.innerText = "";

      const emptyState = document.getElementById("emptyState");

      if (emptyState) {
        emptyState.remove();
      }

      // Create task list item
      const listItem = document.createElement("li");
      listItem.classList.add("task-item");

      // Create checkbox
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.classList.add("task-check");

      // Create task text
      const taskText = document.createElement("span");
      taskText.classList.add("task-text");
      taskText.innerText = taskName;

      // Create delete button
      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.classList.add("delete-button");
      deleteButton.innerText = "Delete";

      // Mark task as completed
      checkbox.addEventListener("change", function () {
        if (checkbox.checked) {
          listItem.classList.add("completed");
        } else {
          listItem.classList.remove("completed");
        }
      });

      // Delete task
      deleteButton.addEventListener("click", function () {
        listItem.remove();

        if (taskList.querySelectorAll(".task-item").length === 0) {
          const emptyMessage = document.createElement("li");
          emptyMessage.id = "emptyState";
          emptyMessage.classList.add("empty-state");
          emptyMessage.innerText =
            "No tasks yet. Add your first task above!";

          taskList.appendChild(emptyMessage);
        }

        updateTaskCount();
      });

      // Add elements to the list
      listItem.append(checkbox, taskText, deleteButton);
      taskList.appendChild(listItem);

      // Clear input after adding
      taskInput.value = "";
      taskInput.focus();

      updateTaskCount();
    }

    // Add task on button click
    addButton.addEventListener("click", addTask);

    // Add task by pressing Enter
    taskInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        addTask();
      }
    });
  </script>

</body>
</html>
